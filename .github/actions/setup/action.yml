# Note: This is a composite GitHub Action.
# Docs: https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

name: setup
description: Accounter environment setup

inputs:
  codegen:
    description: Should run GraphQL Codegen?
    default: 'true'
  pgTyped:
    description: Should run PgTyped?
    default: 'true'
  localDB:
    description: Should run local database?
    default: 'true'
  installDependencies:
    description: Should run yarn install?
    default: 'true'
  tsBuildInfo:
    description: |
      Should restore/save the TypeScript incremental build-info cache? Only worth
      enabling for jobs that actually run `tsc` — jobs that don't would just write
      an empty cache entry on every run.
    default: 'false'
  workingDirectory:
    description: Working dir
    default: ${{ github.workspace }}
  registryUrl:
    description: 'Registry URL for publishing'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install NodeJS
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.installDependencies == 'true' && 'yarn' }}
        registry-url: ${{ inputs.registryUrl }}

    - name: Install Dependencies
      shell: bash
      if: ${{ inputs.installDependencies == 'true' }}
      run: yarn install --immutable

    - name: Cache ESLint
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/.eslintcache
        key:
          eslint-cache-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package.json',
          'yarn.lock') }}
        restore-keys: |
          eslint-cache-${{ runner.os }}-

    # Resolved in a step of its own so the cache keys below stay one line each.
    # `restore-keys` is a literal block: every newline in it separates two keys, so
    # a `${{ }}` expression wrapped across lines to fit the line-length limit is a
    # newline landing inside a key.
    - name: Compute TypeScript Build Info Cache Key
      id: tsbuildinfo-key
      if: ${{ inputs.tsBuildInfo == 'true' }}
      shell: bash
      env:
        INPUTS_HASH: ${{ hashFiles('yarn.lock', 'tsconfig.json', 'packages/*/tsconfig*.json') }}
      run: echo "prefix=tsbuildinfo-${RUNNER_OS}-${INPUTS_HASH}" >> "$GITHUB_OUTPUT"

    - name: Cache TypeScript Build Info
      if: ${{ inputs.tsBuildInfo == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Every type-checking program points `tsBuildInfoFile` here, so one directory
        # covers them all. Programs that *emit* deliberately keep their build info
        # inside their own `outDir` and are not cached here: `tsc` trusts build info
        # without checking that the output it describes still exists, so restoring
        # build info over a fresh checkout (which has no git-ignored `dist`) would
        # make those builds skip the emit and exit 0 with nothing in `dist`.
        #
        # The key is unique per run because cache entries are immutable — without it
        # the first run of the day would pin a stale entry and later runs could never
        # refresh it. `restore-keys` is what actually produces the hit: the same
        # toolchain and tsconfig set first, then the newest entry for the OS. For the
        # `--noEmit` programs cached here there is no output to go stale, so a stale
        # restore costs a full typecheck, never a wrong one.
        path: node_modules/.cache/tsbuildinfo
        key: ${{ steps.tsbuildinfo-key.outputs.prefix }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.tsbuildinfo-key.outputs.prefix }}-
          tsbuildinfo-${{ runner.os }}-

    - name: Set up Docker Buildx
      if: ${{ inputs.pgTyped == 'true' || inputs.localDB == 'true' }}
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Cache Docker layers
      if: ${{ inputs.pgTyped == 'true' || inputs.localDB == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.buildx-cache
        key:
          docker-${{ runner.os }}-${{ hashFiles('docker/docker-compose.dev.yml', 'docker/.ci.env')
          }}
        restore-keys: |
          docker-${{ runner.os }}-

    - name: Run Containers
      shell: bash
      if: ${{ inputs.pgTyped == 'true' || inputs.localDB == 'true' }}
      run: |
        source docker/.ci.env
        docker compose \
          -f docker/docker-compose.dev.yml \
          up -d --wait

    - name: Run DB Migrations
      shell: bash
      if: ${{ inputs.pgTyped == 'true' || inputs.localDB == 'true' }}
      run: yarn db:init

    - name: Cache GraphQL Generated Types
      if: ${{ inputs.codegen == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: graphql-cache
      with:
        # Every `generate:graphql` output must be listed: on an exact cache hit the
        # generate step is skipped, so anything missing here is simply absent for the
        # rest of the job. `packages/server/src/__generated__` was missing, which broke
        # any module value-importing from it (e.g. the `TransactionDirection` enum).
        path: |
          schema.graphql
          packages/server/src/__generated__
          packages/server/src/modules/**/__generated__
          packages/client/src/gql
          packages/gmail-listener/src/gql
          packages/email-ingestion-gateway/src/gql
          packages/mcp-server/src/gql
          packages/scraper-app/src/server/gql
        key:
          graphql-codegen-${{ runner.os }}-${{ hashFiles('packages/server/src/modules/**/*.ts',
          'codegen.ts', 'graphql.config.js', 'packages/client/src/**/*.{,c,m}{j,t}s{,x}',
          'packages/gmail-listener/src/**/*.ts', 'packages/email-ingestion-gateway/src/**/*.ts',
          'packages/mcp-server/src/**/*.ts', 'packages/scraper-app/src/**/*.{ts,tsx}', 'yarn.lock')
          }}
        restore-keys: |
          graphql-codegen-${{ runner.os }}-

    - name: Generate GraphQL Types
      if: ${{ inputs.codegen == 'true' && steps.graphql-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: yarn generate:graphql

    - name: Cache PgTyped Generated Types
      if: ${{ inputs.pgTyped == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: pgtyped-cache
      with:
        path: |
          packages/server/src/**/*.types.ts
          packages/migrations/src/**/*.types.ts
        key:
          pgtyped-${{ runner.os }}-${{ hashFiles('docker/pgconfig.json', 'yarn.lock',
          'packages/server/src/**/providers/*.provider.ts',
          'packages/server/src/plugins/admin-context-plugin.ts') }}
        restore-keys: |
          pgtyped-${{ runner.os }}-

    - name: Generate Postgres Types
      if:
        ${{ inputs.pgTyped == 'true' && inputs.localDB == 'true' &&
        steps.pgtyped-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: yarn pgtyped -c docker/pgconfig.json

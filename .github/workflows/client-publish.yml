name: 'Client Publish'
on:
  push:
    paths:
      - 'packages/client/**'
    branches:
      - main
      - prod

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  search-token:
    runs-on: ubuntu-latest
    environment: accounter-fullstack
    outputs:
      api_token_present: ${{ steps.secrets_present.outputs.api_token }}
    steps:
      - name: check for Hive token presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        id: secrets_present
        run: echo "api_token=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> $GITHUB_OUTPUT

  client-publish:
    needs: [search-token]
    if: ${{needs.search-token.outputs.api_token_present == 'true'}}
    runs-on: ubuntu-latest
    environment: accounter-fullstack
    permissions:
      contents: read
      deployments: write
    name: Publish Client to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Dependencies
        run: yarn

      - name: Generate GraphQL
        run: yarn generate:graphql

      # This job doesn't go through ./.github/actions/setup, so it wires the
      # TypeScript build-info cache up itself. See that action for why the key
      # carries a per-run suffix and why the prefix is computed in its own step.
      - name: Compute TypeScript Build Info Cache Key
        id: tsbuildinfo-key
        env:
          INPUTS_HASH: ${{ hashFiles('yarn.lock', 'tsconfig.json', 'packages/*/tsconfig*.json') }}
        run: echo "prefix=tsbuildinfo-${RUNNER_OS}-${INPUTS_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache TypeScript Build Info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/tsbuildinfo
          key: ${{ steps.tsbuildinfo-key.outputs.prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.tsbuildinfo-key.outputs.prefix }}-
            tsbuildinfo-${{ runner.os }}-

      - name: Build Client
        working-directory: packages/client
        env:
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_FRONTEND_CLIENT_ID: ${{ vars.AUTH0_FRONTEND_CLIENT_ID }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
        run:
          yarn build  --mode ${{ (github.ref == 'refs/heads/main' && 'staging') || (github.ref ==
          'refs/heads/prod' && 'production') || 'development' }}

      # cloudflare/pages-action was deprecated and its repository deleted, so a
      # pinned SHA no longer resolves. wrangler-action is Cloudflare's supported
      # replacement; the old projectName/directory inputs fold into `command`.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: yarn
          workingDirectory: packages/client
          command:
            pages deploy dist --project-name=${{ (github.ref == 'refs/heads/main' &&
            'accounter-staging') || 'accounter-prod' }} --branch=${{ github.ref_name }}

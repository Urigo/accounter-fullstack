on:
  workflow_call:

env:
  NODE_NO_WARNINGS: true
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: accounter

jobs:
  validate-schema:
    name: Validate GraphQL schema
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup environment
        uses: ./.github/actions/setup

      - name: Validate GraphQL schema
        run: yarn graphql:validate

      # The MCP server's operations are tagged template literals, so codegen
      # never reads them and `graphql:validate` (client documents only) cannot
      # cover them. Without this, a bad field name fails only at runtime.
      - name: Validate MCP server GraphQL documents
        run: yarn workspace @accounter/mcp-server validate:graphql
